version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowie_postgres
    restart: always
    environment:
      POSTGRES_USER: flowie
      POSTGRES_PASSWORD: flowie_password
      POSTGRES_DB: flowie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowie -d flowie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowie_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: flowie_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}
      DATABASE_URL: "postgresql://flowie:flowie_password@postgres:5432/flowie_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production

volumes:
  postgres_data:
  redis_data:
